<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Carrusel de lanzamiento del Álbum de vinos: adentro. Identidad Oficina Gráfica sobre fondo tinta. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Brico;src:url('../../fuentes/BricolageGrotesque[opsz,wdth,wght].ttf');font-weight:200 800;}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  @font-face{font-family:Marker;src:url('../../fuentes/PermanentMarker-Regular.ttf');}
  html,body{margin:0;}
  svg{display:block;}
  .bungee{font-family:Bungee;} .brico{font-family:Brico;} .karla{font-family:Karla;} .marker{font-family:Marker;}
</style></head><body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0.35 0"/></filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="mano"><feTurbulence type="fractalNoise" baseFrequency="0.03 0.05" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <marker id="punta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10" fill="none" stroke="#9BD0EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <symbol id="mira" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="10"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="10"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="10"/>
      <circle cx="50" cy="50" r="12" fill="#1C82D9"/>
    </symbol>
  </defs>
  <rect width="1080" height="1350" fill="#142A40"/>
  <g stroke="#EEE7D8" stroke-width="3" opacity=".5">
    <path d="M40 70H90M70 40V90M1040 70H990M1010 40V90M40 1280H90M70 1310V1260M1040 1280H990M1010 1310V1260"/>
  </g>
  <g transform="translate(112 92)" color="#EEE7D8">
    <svg width="40" height="40"><use href="#mira"/></svg>
    <text class="marker" x="52" y="31" font-size="30" fill="#EEE7D8">Oficina Gráfica</text>
  </g>
  <text class="bungee" x="968" y="122" font-size="30" fill="#9BD0EF" text-anchor="end">2/3</text>

  <text class="bungee" x="540" y="232" font-size="70" fill="#9BD0EF" text-anchor="middle">ADENTRO</text>
  <g transform="translate(540 760) rotate(2.5)" filter="url(#sombra)">
    <image href="pagina.png" x="-300" y="-425" width="600" height="850"/>
  </g>
  <!-- llamadas a mano -->
  <g fill="none" stroke="#9BD0EF" stroke-width="4" stroke-linecap="round" filter="url(#mano)">
    <path d="M150 420C175 470 205 520 262 560" marker-end="url(#punta)"/>
    <path d="M930 520C905 560 880 590 830 620" marker-end="url(#punta)"/>
    <path d="M140 1010C170 980 200 960 255 930" marker-end="url(#punta)"/>
    <path d="M935 1130C905 1110 875 1095 815 1088" marker-end="url(#punta)"/>
  </g>
  <g class="brico" font-size="27" font-weight="600" fill="#EEE7D8">
    <text x="62" y="378">fecha, cepa</text><text x="62" y="410">y bodega</text>
    <text x="1018" y="480" text-anchor="end">estrellas</text><text x="1018" y="512" text-anchor="end">y aromas</text>
    <text x="52" y="1052">la etiqueta,</text><text x="52" y="1084">pegada</text>
    <text x="1028" y="1172" text-anchor="end">¿se repite?</text>
  </g>

  <rect width="1080" height="1350" filter="url(#grano)" opacity=".18" style="mix-blend-mode:screen"/>
</svg>
</body></html>
