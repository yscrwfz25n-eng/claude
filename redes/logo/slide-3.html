<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Carrusel informativo sobre el origen del logo: por qué lo elegimos. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Brico;src:url('../../fuentes/BricolageGrotesque[opsz,wdth,wght].ttf');font-weight:200 800;}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  @font-face{font-family:Marker;src:url('../../fuentes/PermanentMarker-Regular.ttf');}
  html,body{margin:0;}
  svg{display:block;}
  .bungee{font-family:Bungee;} .brico{font-family:Brico;} .karla{font-family:Karla;} .marker{font-family:Marker;}
</style></head><body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.16  0 0 0 0 0.25  0 0 0 0.5 0"/></filter>
    <filter id="sombra" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#142A40" flood-opacity="1"/></filter>
    <symbol id="mira" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="8"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="50" r="11" fill="#1C82D9"/>
    </symbol>
    <symbol id="mira-plana" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="8"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="50" r="11" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1080" height="1350" fill="#EEE7D8"/>
  <g stroke="#142A40" stroke-width="3" opacity=".55">
    <path d="M40 70H90M70 40V90M1040 70H990M1010 40V90M40 1280H90M70 1310V1260M1040 1280H990M1010 1310V1260"/>
  </g>
  <text class="bungee" x="1010" y="134" font-size="28" fill="#2C6690" text-anchor="end">3/3</text>

  <g transform="translate(110 92)">
    <rect width="420" height="58" rx="29" fill="#1C82D9"/>
    <text class="bungee" x="210" y="41" font-size="30" fill="#FBF8F1" text-anchor="middle">POR QUÉ LO ELEGIMOS</text>
  </g>
  <text class="bungee" x="540" y="290" font-size="76" fill="#142A40" text-anchor="middle">PORQUE ES LO QUE</text>
  <text class="bungee" x="540" y="378" font-size="76" fill="#1C82D9" text-anchor="middle">HACEMOS TODOS</text>
  <text class="bungee" x="540" y="466" font-size="76" fill="#1C82D9" text-anchor="middle">LOS DÍAS</text>
  <g transform="translate(150 560)">
    <g color="#1C82D9"><svg width="54" height="54"><use href="#mira-plana"/></svg></g>
    <text class="karla" x="86" y="22" font-size="38" font-weight="700" fill="#142A40">De la idea al papel.</text>
    <text class="karla" x="86" y="70" font-size="34" font-weight="400" fill="#142A40">Diseñamos y producimos nuestra propia línea.</text>
  </g>
  <g transform="translate(150 720)">
    <g color="#1C82D9"><svg width="54" height="54"><use href="#mira-plana"/></svg></g>
    <text class="karla" x="86" y="22" font-size="38" font-weight="700" fill="#142A40">Hoja por hoja.</text>
    <text class="karla" x="86" y="70" font-size="34" font-weight="400" fill="#142A40">Todo pasa por nuestras manos.</text>
  </g>
  <g transform="translate(150 880)">
    <g color="#1C82D9"><svg width="54" height="54"><use href="#mira-plana"/></svg></g>
    <text class="karla" x="86" y="22" font-size="38" font-weight="700" fill="#142A40">Si no está en registro, no sale.</text>
    <text class="karla" x="86" y="70" font-size="34" font-weight="400" fill="#142A40">Si hace falta, lo reimprimimos.</text>
  </g>

  <g transform="translate(540 1110)">
    <rect x="-300" y="-46" width="600" height="92" rx="46" fill="#142A40"/>
    <text class="brico" x="0" y="13" font-size="36" font-weight="700" fill="#EEE7D8" text-anchor="middle">Pedidos personalizados por MD</text>
  </g>
  <g transform="translate(362 1190)" color="#142A40">
    <svg width="48" height="48"><use href="#mira"/></svg>
    <text class="marker" x="62" y="37" font-size="36" fill="#142A40">Oficina Gráfica</text>
  </g>

  <rect width="1080" height="1350" filter="url(#grano)" opacity=".3" style="mix-blend-mode:multiply"/>
</svg>
</body></html>
