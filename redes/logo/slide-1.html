<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Carrusel informativo sobre el origen del logo: portada. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Brico;src:url('../../fuentes/BricolageGrotesque[opsz,wdth,wght].ttf');font-weight:200 800;}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  @font-face{font-family:Marker;src:url('../../fuentes/PermanentMarker-Regular.ttf');}
  html,body{margin:0;}
  svg{display:block;}
  .bungee{font-family:Bungee;} .brico{font-family:Brico;} .karla{font-family:Karla;} .marker{font-family:Marker;}
</style></head><body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.16  0 0 0 0 0.25  0 0 0 0.5 0"/></filter>
    <filter id="sombra" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#142A40" flood-opacity="1"/></filter>
    <symbol id="mira" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="8"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="50" r="11" fill="#1C82D9"/>
    </symbol>
    <symbol id="mira-plana" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="8"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="50" r="11" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1080" height="1350" fill="#EEE7D8"/>
  <g stroke="#142A40" stroke-width="3" opacity=".55">
    <path d="M40 70H90M70 40V90M1040 70H990M1010 40V90M40 1280H90M70 1310V1260M1040 1280H990M1010 1310V1260"/>
  </g>
  <text class="bungee" x="1010" y="134" font-size="28" fill="#2C6690" text-anchor="end">1/2</text>

  <g transform="translate(110 92)">
    <rect width="300" height="58" rx="29" fill="#1C82D9"/>
    <text class="bungee" x="150" y="41" font-size="30" fill="#FBF8F1" text-anchor="middle">NUESTRA MARCA</text>
  </g>
  <g transform="translate(345 230)" color="#142A40"><svg width="390" height="390"><use href="#mira"/></svg></g>
  <text class="bungee" x="540" y="760" font-size="80" fill="#142A40" text-anchor="middle">LA HISTORIA</text>
  <text class="bungee" x="540" y="850" font-size="80" fill="#142A40" text-anchor="middle">DETRÁS DE</text>
  <text class="bungee" x="540" y="940" font-size="80" fill="#1C82D9" text-anchor="middle">NUESTRO LOGO</text>
  <text class="karla" x="540" y="1040" font-size="40" font-weight="500" fill="#2C6690" text-anchor="middle">Spoiler: no es una mira.</text>
  <g transform="translate(455 1150)">
    <rect width="170" height="62" rx="31" fill="#142A40"/>
    <text class="brico" x="30" y="41" font-size="27" font-weight="700" fill="#EEE7D8">deslizá</text>
    <path d="M128 31h22M141 21l10 10-10 10" fill="none" stroke="#9BD0EF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect width="1080" height="1350" filter="url(#grano)" opacity=".3" style="mix-blend-mode:multiply"/>
</svg>
</body></html>
