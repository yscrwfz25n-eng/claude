<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Trivia «¿De dónde salió nuestro logo?»: respuesta. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Brico;src:url('../../fuentes/BricolageGrotesque[opsz,wdth,wght].ttf');font-weight:200 800;}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  @font-face{font-family:Marker;src:url('../../fuentes/PermanentMarker-Regular.ttf');}
  html,body{margin:0;}
  svg{display:block;}
  .bungee{font-family:Bungee;} .brico{font-family:Brico;} .karla{font-family:Karla;} .marker{font-family:Marker;}
</style></head><body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.16  0 0 0 0 0.25  0 0 0 0.5 0"/></filter>
    <filter id="sombra" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#142A40" flood-opacity="1"/></filter>
    <symbol id="mira" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="8"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="50" r="11" fill="#1C82D9"/>
    </symbol>
    <symbol id="mira-plana" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <line x1="50" y1="2" x2="50" y2="98" stroke="currentColor" stroke-width="8"/>
      <line x1="2" y1="50" x2="98" y2="50" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="50" r="11" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1080" height="1350" fill="#EEE7D8"/>
  <g stroke="#142A40" stroke-width="3" opacity=".55">
    <path d="M40 70H90M70 40V90M1040 70H990M1010 40V90M40 1280H90M70 1310V1260M1040 1280H990M1010 1310V1260"/>
  </g>
  <text class="bungee" x="1010" y="134" font-size="28" fill="#2C6690" text-anchor="end">2/2</text>

  <g transform="translate(110 92)">
    <rect width="300" height="58" rx="29" fill="#1C82D9"/>
    <text class="bungee" x="150" y="41" font-size="30" fill="#FBF8F1" text-anchor="middle">RESPUESTA: B</text>
  </g>
  <text class="bungee" x="540" y="275" font-size="84" fill="#142A40" text-anchor="middle">UNA MARCA</text>
  <text class="bungee" x="540" y="368" font-size="84" fill="#1C82D9" text-anchor="middle">DE REGISTRO</text>

  <!-- fuera de registro: cian, magenta, amarillo y negro corridos -->
  <g transform="translate(150 450)">
    <rect width="360" height="360" rx="36" fill="#FBF8F1" stroke="#142A40" stroke-width="4"/>
    <g style="isolation:isolate">
      <g transform="translate(66 78)" color="#00AEEF" style="mix-blend-mode:multiply"><svg width="220" height="220"><use href="#mira-plana"/></svg></g>
      <g transform="translate(90 60)" color="#EC008C" style="mix-blend-mode:multiply"><svg width="220" height="220"><use href="#mira-plana"/></svg></g>
      <g transform="translate(76 52)" color="#FFE600" style="mix-blend-mode:multiply"><svg width="220" height="220"><use href="#mira-plana"/></svg></g>
      <g transform="translate(48 92)" color="#142A40" style="mix-blend-mode:multiply"><svg width="220" height="220"><use href="#mira-plana"/></svg></g>
    </g>
  </g>
  <text class="brico" x="330" y="870" font-size="32" font-weight="600" fill="#142A40" text-anchor="middle">fuera de registro</text>

  <!-- en registro: todo cae en el mismo lugar -->
  <g transform="translate(570 450)">
    <rect width="360" height="360" rx="36" fill="#FBF8F1" stroke="#142A40" stroke-width="4"/>
    <g transform="translate(70 70)" color="#142A40"><svg width="220" height="220"><use href="#mira"/></svg></g>
  </g>
  <text class="brico" x="750" y="870" font-size="32" font-weight="600" fill="#142A40" text-anchor="middle">en registro ✓</text>

  <g class="karla" font-size="36" font-weight="500" fill="#142A40" text-anchor="middle">
    <text x="540" y="970">En la imprenta va en los bordes de cada hoja</text>
    <text x="540" y="1018">para que los cuatro colores caigan justo</text>
    <text x="540" y="1066">en su lugar. Si la mira está alineada,</text>
    <text x="540" y="1114" font-weight="800">el trabajo salió bien.</text>
  </g>
  <g transform="translate(362 1160)" color="#142A40">
    <svg width="48" height="48"><use href="#mira"/></svg>
    <text class="marker" x="62" y="37" font-size="36" fill="#142A40">Oficina Gráfica</text>
  </g>

  <rect width="1080" height="1350" filter="url(#grano)" opacity=".3" style="mix-blend-mode:multiply"/>
</svg>
</body></html>
