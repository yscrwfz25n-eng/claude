<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Portada de Facebook 1640 x 624 estilo hoja de agenda anillada (papel arrugado, grilla y sticker con garabatos).
     Lo importante va en el centro (≈ 1100 px): en el celular Facebook recorta los costados. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Brico;src:url('../../fuentes/BricolageGrotesque[opsz,wdth,wght].ttf');font-weight:200 800;}
  @font-face{font-family:Marker;src:url('../../fuentes/PermanentMarker-Regular.ttf');}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  html,body{margin:0;width:1640px;height:624px;overflow:hidden;}
  body{position:relative;background:#F3EFE6;font-family:Karla;color:#142A40;}
  .abs{position:absolute;}
</style></head><body>
<svg class="abs" style="left:0;top:0" width="1640" height="624" viewBox="0 0 1640 624">
  <defs>
    <!-- papel arrugado: relieve con luz rasante -->
    <filter id="arrugado" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.01" numOctaves="4" seed="12" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="2.5" lighting-color="#FBF8F2" result="luz">
        <feDistantLight azimuth="235" elevation="66"/></feDiffuseLighting>
      <feComposite in="luz" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="mano"><feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="borde"/>
      <feFlood flood-color="#FFFFFF"/><feComposite in2="borde" operator="in" result="blanco"/>
      <feDropShadow in="blanco" dx="0" dy="5" stdDeviation="5" flood-color="#142A40" flood-opacity=".18" result="sombra"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="estrella" d="M0 -26L5 -5L26 0L5 5L0 26L-5 5L-26 0L-5 -5Z"/>
  </defs>
  <rect width="1640" height="624" fill="#F3EFE6" filter="url(#arrugado)"/>

  <!-- franja de arriba y anillado -->
  <rect width="1640" height="22" fill="#9BD0EF"/>
  <g>
    <g id="anillo">
      <ellipse cx="0" cy="66" rx="8" ry="8" fill="#1B1B1B"/>
      <path d="M-6 66C-14 40 -10 6 2 2C10 0 12 20 6 64" fill="none" stroke="#8C8C8C" stroke-width="7" stroke-linecap="round"/>
      <path d="M-6 66C-14 40 -10 6 2 2C10 0 12 20 6 64" fill="none" stroke="#E9E9E9" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <g id="anillos"><use href="#anillo" x="40"/><use href="#anillo" x="120"/><use href="#anillo" x="200"/><use href="#anillo" x="280"/><use href="#anillo" x="360"/><use href="#anillo" x="440"/><use href="#anillo" x="520"/><use href="#anillo" x="600"/><use href="#anillo" x="680"/><use href="#anillo" x="760"/><use href="#anillo" x="840"/><use href="#anillo" x="920"/><use href="#anillo" x="1000"/><use href="#anillo" x="1080"/><use href="#anillo" x="1160"/><use href="#anillo" x="1240"/><use href="#anillo" x="1320"/><use href="#anillo" x="1400"/><use href="#anillo" x="1480"/><use href="#anillo" x="1560"/></g>

  <!-- grilla de agenda: los pasos de cada pedido -->
  <g stroke="#1B1B1B" stroke-width="2.4" opacity=".85">
    <path d="M0 196H1640M0 524H1640M270 120V624M545 120V624M820 120V624M1095 120V624M1370 120V624"/>
  </g>
  <g font-family="Karla" font-style="italic" font-weight="500" font-size="30" fill="#3A3A3A" text-anchor="middle">
    <text x="410" y="170">diseñamos</text><text x="682" y="170">imprimimos</text>
    <text x="958" y="170">armamos</text><text x="1232" y="170">enviamos</text>
  </g>
  <g font-family="Bungee" font-size="34" fill="#3A3A3A">
    <text x="300" y="250">01</text><text x="572" y="250">02</text><text x="847" y="250">03</text><text x="1122" y="250">04</text>
  </g>
</svg>

<!-- garabatos y objetos -->
<svg class="abs" style="left:0;top:0" width="1640" height="624" viewBox="0 0 1640 624">
  <g filter="url(#mano)">
    <!-- lápiz celeste -->
    <g transform="translate(340 360) rotate(-38) scale(.85)">
      <rect x="-90" y="-20" width="170" height="40" rx="5" fill="#9BD0EF"/>
      <path d="M80 -20L122 0L80 20Z" fill="#F6E3C2"/><path d="M110 -6L122 0L110 6Z" fill="#142A40"/>
      <rect x="-104" y="-20" width="16" height="40" rx="4" fill="#F2B8C6"/>
      <path d="M-80 -8H70M-80 8H70" stroke="#FBF8F1" stroke-width="3"/>
    </g>
    <!-- cartas -->
    <g transform="translate(1290 360) rotate(14) scale(.85)">
      <rect x="-48" y="-68" width="96" height="136" rx="12" fill="#5C0F1E"/>
      <rect x="-38" y="-58" width="76" height="116" rx="8" fill="none" stroke="#EFE3D0" stroke-width="3"/>
      <rect x="-82" y="-60" width="96" height="136" rx="12" fill="#FBF8F1" stroke="#142A40" stroke-width="3" transform="rotate(-20)"/>
      <path d="M-62 -40H-10" stroke="#1C82D9" stroke-width="6" transform="rotate(-20)"/>
    </g>
    <!-- tijera -->
    <g transform="translate(1150 480) rotate(-20)" fill="none" stroke="#142A40" stroke-width="5" stroke-linecap="round">
      <circle cx="-34" cy="18" r="13"/><circle cx="-34" cy="-18" r="13"/>
      <path d="M-22 12L40 -14M-22 -12L40 14"/>
    </g>
    <!-- regla -->
    <g transform="translate(470 485) rotate(12) scale(.85)">
      <rect x="-90" y="-16" width="180" height="32" rx="4" fill="#F08A24"/>
      <path d="M-74 -16V-4M-56 -16V-8M-38 -16V-4M-20 -16V-8M-2 -16V-4M16 -16V-8M34 -16V-4M52 -16V-8M70 -16V-4" stroke="#FBF8F1" stroke-width="3"/>
    </g>
  </g>
  <g fill="none" stroke-width="5" stroke-linecap="round" filter="url(#mano)">
    <path d="M680 246q12 -22 24 0t24 0t24 0t24 0" stroke="#F08A24"/>
    <path d="M1240 230q-14 18 0 30t0 30" stroke="#1C82D9"/>
    <path d="M1000 570c-10 -16 14 -26 18 -10c4 16 -24 22 -18 2" stroke="#1C82D9"/>
  </g>
  <g fill="#F2B8C6"><use href="#estrella" transform="translate(330 270) scale(.9)"/></g>
  <g fill="#1C82D9"><use href="#estrella" transform="translate(1330 560) scale(.8)"/></g>
  <g fill="#9BD0EF"><use href="#estrella" transform="translate(720 570) scale(.6)"/></g>
</svg>

<!-- sticker central -->
<div class="abs" style="left:0;right:0;top:262px;display:flex;flex-direction:column;align-items:center;">
  <svg width="820" height="200" viewBox="0 0 820 200" style="overflow:visible">
    <g filter="url(#sticker)">
      <g transform="translate(62 92)">
        <g transform="scale(1.0)">
          <circle cx="0" cy="0" r="35.5" fill="none" stroke="#142A40" stroke-width="10"/>
          <line x1="0" y1="-49" x2="0" y2="49" stroke="#142A40" stroke-width="10"/>
          <line x1="-49" y1="0" x2="49" y2="0" stroke="#142A40" stroke-width="10"/>
          <circle r="11" fill="#3B7FD0"/>
        </g>
      </g>
      <text x="136" y="118" font-family="Marker" font-size="92" fill="#142A40">Oficina Gráfica</text>
      <text x="150" y="178" font-family="Bungee" font-size="34" fill="#1C82D9" letter-spacing="2">JUEGOS · LIBROS · PAPELERÍA</text>
    </g>
  </svg>
  <div style="margin-top:6px;background:#F2B8C6;color:#142A40;padding:6px 18px;font-family:Brico;font-weight:700;font-size:26px;transform:rotate(-2deg);">
    ✉ pedidos personalizados por MD</div>
</div>
</body></html>
