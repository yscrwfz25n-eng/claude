<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Carrusel continuo de 2 slides (2160 x 1350, se corta al medio): «Te quiero… pedir un regalito»
     con los 5 productos de Oficina Gráfica. El perro (de la referencia) queda partido entre las dos slides. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  html,body{margin:0;}
  svg{display:block;}
  .bungee{font-family:Bungee;} .karla{font-family:Karla;}
</style></head><body>
<svg width="2160" height="1350" viewBox="0 0 2160 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.16  0 0 0 0 0.25  0 0 0 0.45 0"/></filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#142A40" flood-opacity=".28"/></filter>
    <!-- corazón y destello -->
    <path id="corazon" d="M0 -8C-6 -20 -26 -18 -26 -2C-26 12 -8 22 0 30C8 22 26 12 26 -2C26 -18 6 -20 0 -8Z"/>
    <path id="destello" d="M0 -30Q4 -4 30 0Q4 4 0 30Q-4 4 -30 0Q-4 -4 0 -30Z"/>
    <path id="arco" d="M120 760C190 430 520 200 1010 168"/>
  </defs>
  <rect width="2160" height="1350" fill="#9BD0EF"/>

  <!-- ===== slide 1 ===== -->
  <text class="bungee" font-size="112" fill="#142A40" letter-spacing="2"><textPath href="#arco">TE QUIERO...</textPath></text>
  <g fill="#FBF8F1"><use href="#corazon" transform="translate(70 820) rotate(-18) scale(1.2)"/>
    <use href="#corazon" transform="translate(150 880) rotate(12) scale(.8)"/>
    <use href="#corazon" transform="translate(1040 130) rotate(14)"/></g>
  <g fill="#1C82D9"><use href="#destello" transform="translate(150 1110)"/><use href="#destello" transform="translate(205 1165) scale(.55)"/>
    <use href="#destello" transform="translate(330 330) scale(.7)"/></g>

  <!-- el perro de la referencia, partido entre las dos slides en el mismo lugar que el original -->
  <image href="perro-salchicha.png" x="421" y="220" width="1023" height="1236"/>

  <!-- ===== slide 2 ===== -->
  <g class="bungee" fill="#142A40" font-size="104">
    <text x="1470" y="190">PEDIR UN</text>
    <text x="1470" y="306">REGALITO</text>
  </g>
  <!-- productos en racimo, apenas encimados -->
  <g filter="url(#sombra)">
    <g transform="translate(1655 610) rotate(-6)"><image href="caja-match.png" x="-142" y="-175" width="285" height="350"/></g>
    <g transform="translate(1945 600) rotate(5)"><image href="caja-opinologos.png" x="-142" y="-175" width="285" height="350"/></g>
    <g transform="translate(1975 930) rotate(7)"><image href="album-alfajores.png" x="-172" y="-165" width="344" height="330"/></g>
    <g transform="translate(1610 975) rotate(5)"><image href="libro-dating-list.png" x="-123" y="-180" width="246" height="360"/></g>
    <g transform="translate(1825 1105) rotate(-4)"><image href="libro-vinos.png" x="-128" y="-175" width="256" height="350"/></g>
    <g transform="translate(1475 1200) rotate(-14)"><image href="carta-match-reto.png" x="-66" y="-89" width="132" height="178"/></g>
  </g>
  <g fill="#FBF8F1"><use href="#corazon" transform="translate(1800 420) rotate(-10) scale(.75)"/>
    <use href="#corazon" transform="translate(2110 820) rotate(16) scale(.7)"/>
    <use href="#corazon" transform="translate(2080 1230) rotate(-12) scale(.8)"/>
    <use href="#corazon" transform="translate(1455 735) rotate(8) scale(.6)"/></g>
  <g fill="#1C82D9"><use href="#destello" transform="translate(2100 120) scale(.8)"/>
    <use href="#destello" transform="translate(2120 420) scale(.6)"/><use href="#destello" transform="translate(1990 1290) scale(.55)"/>
    <use href="#destello" transform="translate(1495 420) scale(.7)"/></g>

  <rect width="2160" height="1350" filter="url(#grano)" opacity=".22" style="mix-blend-mode:multiply"/>
</svg>
</body></html>
