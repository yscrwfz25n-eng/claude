<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Carrusel continuo de 2 slides (2160 x 1350, se corta al medio): «Te quiero… pedir un regalito»
     con los productos de Oficina Gráfica. El perro queda partido entre las dos slides. -->
<style>
  @font-face{font-family:Bungee;src:url('../../fuentes/Bungee-Regular.ttf');}
  @font-face{font-family:Karla;src:url('../../fuentes/Karla[wght].ttf');font-weight:200 800;}
  html,body{margin:0;}
  svg{display:block;}
  .bungee{font-family:Bungee;} .karla{font-family:Karla;}
</style></head><body>
<svg width="2160" height="1350" viewBox="0 0 2160 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.16  0 0 0 0 0.25  0 0 0 0.45 0"/></filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#142A40" flood-opacity=".28"/></filter>
    <!-- corazón y destello -->
    <path id="corazon" d="M0 -8C-6 -20 -26 -18 -26 -2C-26 12 -8 22 0 30C8 22 26 12 26 -2C26 -18 6 -20 0 -8Z"/>
    <path id="destello" d="M0 -30Q4 -4 30 0Q4 4 0 30Q-4 4 -30 0Q-4 -4 0 -30Z"/>
    <path id="arco" d="M150 640C260 400 520 250 960 228"/>
  </defs>
  <rect width="2160" height="1350" fill="#9BD0EF"/>

  <!-- ===== slide 1 ===== -->
  <text class="bungee" font-size="112" fill="#142A40" letter-spacing="2"><textPath href="#arco">TE QUIERO...</textPath></text>
  <g fill="#FBF8F1"><use href="#corazon" transform="translate(95 790) rotate(-18) scale(1.2)"/>
    <use href="#corazon" transform="translate(330 1080) rotate(12) scale(.8)"/>
    <use href="#corazon" transform="translate(965 160) rotate(14)"/></g>
  <g fill="#1C82D9"><use href="#destello" transform="translate(200 880)"/><use href="#destello" transform="translate(250 935) scale(.55)"/>
    <use href="#destello" transform="translate(180 1150) scale(.8)"/></g>

  <!-- el perro, partido justo por la nariz entre las dos slides -->
  <image href="perro-grande.png" x="450" y="275" width="954" height="1075"/>

  <!-- ===== slide 2 ===== -->
  <g class="bungee" fill="#142A40" font-size="108">
    <text x="1450" y="240">PEDIR</text>
    <text x="1640" y="362">UN</text>
    <text x="1450" y="484">REGALITO</text>
  </g>
  <g filter="url(#sombra)">
    <g transform="translate(1610 715) rotate(-6)"><image href="caja-match.png" x="-166" y="-180" width="332" height="360"/></g>
    <g transform="translate(1975 690) rotate(5)"><image href="caja-opinologos.png" x="-166" y="-180" width="332" height="360"/></g>
    <g transform="translate(1600 1105) rotate(6)"><image href="libro-dating-list.png" x="-147" y="-215" width="294" height="430"/></g>
    <g transform="translate(1965 1095) rotate(-5)"><image href="libro-vinos.png" x="-157" y="-215" width="314" height="430"/></g>
    <g transform="translate(1365 1210) rotate(-14)"><image href="carta-match-reto.png" x="-74" y="-100" width="148" height="200"/></g>
  </g>
  <g fill="#FBF8F1"><use href="#corazon" transform="translate(1790 560) rotate(-10) scale(.9)"/>
    <use href="#corazon" transform="translate(1440 890) rotate(16) scale(.7)"/>
    <use href="#corazon" transform="translate(2110 900) rotate(-12) scale(.8)"/>
    <use href="#corazon" transform="translate(1780 1300) rotate(8) scale(.75)"/></g>
  <g fill="#1C82D9"><use href="#destello" transform="translate(1420 120) scale(.8)"/>
    <use href="#destello" transform="translate(1800 905) scale(.9)"/><use href="#destello" transform="translate(1835 945) scale(.5)"/>
    <use href="#destello" transform="translate(2120 560) scale(.7)"/></g>

  <rect width="2160" height="1350" filter="url(#grano)" opacity=".22" style="mix-blend-mode:multiply"/>
</svg>
</body></html>
